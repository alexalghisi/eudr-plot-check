[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eudr-plot-check"
version = "0.1.0"
description = "Validates farm plot lists for EUDR due diligence and checks them against deforestation data in PostGIS"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
plot-check = "plot_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plot_check = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
